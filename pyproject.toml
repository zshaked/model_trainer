[project]
name = "model-trainer"
version = "0.1.0"
description = "Autonomous ML research loop — Beyond Transformers"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["loop", "prepare", "train"]
